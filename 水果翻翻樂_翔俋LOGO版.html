const ANIMALS=['🐶','🐱','🐻','🐼','🐰','🦊','🐸','🐨','🐯','🐵','🐷','🐧'];
const $=id=>document.getElementById(id);
let mode='fruit',customImages=[],deck=[],first=null,second=null,locked=false,moves=0,matched=0,started=0,elapsed=0,ticker=null,round=0,confettiAnimation=null;
function shuffle(array){let a=[...array];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function clock(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function update(){ $('moves').textContent=moves;$('pairs').textContent=matched+' / 8';$('time').textContent=clock(elapsed);}
function stopTimer(){if(ticker!==null){clearInterval(ticker);ticker=null;}}
function startTimer(){if(ticker!==null)return;started=Date.now()-elapsed*1000;ticker=setInterval(()=>{elapsed=Math.floor((Date.now()-started)/1000);update()},250)}
function fresh(){round++;stopTimer();if(confettiAnimation)cancelAnimationFrame(confettiAnimation);$('confetti').getContext('2d').clearRect(0,0,$('confetti').width,$('confetti').height);$('win').hidden=true;first=null;second=null;locked=false;moves=matched=elapsed=0;update();$('message').textContent='點任一張牌開始計時！';let choices;
if(mode==='photo')choices=customImages.map((src,i)=>({name:'自訂照片 '+(i+1),src,kind:'photo'}));
else if(mode==='animal')choices=shuffle(ANIMALS).slice(0,8).map(a=>({name:'小動物',value:a,kind:'animal'}));
else choices=shuffle(FRUITS).slice(0,8).map(f=>({name:f.name,src:f.src,kind:'fruit'}));
deck=shuffle(choices.flatMap((x,id)=>[{...x,id,uid:id+'a'},{...x,id,uid:id+'b'}]));const board=$('board');board.replaceChildren();deck.forEach((c,i)=>{let btn=document.createElement('button');btn.className='card';btn.type='button';btn.setAttribute('aria-label','第 '+(i+1)+' 張牌，未翻開');btn.innerHTML='<span class="card-inner"><span class="side back"><img class="logo" alt="" src="'+LOGO+'"></span><span class="side front"></span></span>';let face=btn.querySelector('.front');if(c.kind==='animal'){let span=document.createElement('span');span.className='animal';span.textContent=c.value;face.append(span)}else{let img=document.createElement('img');img.alt=c.name;img.src=c.src;if(c.kind==='photo')img.className='user-photo';face.append(img)}btn.addEventListener('click',()=>flip(btn,c));board.append(btn);});}
function flip(btn,c){if(locked||btn.classList.contains('is-up')||btn.classList.contains('is-matched'))return;startTimer();btn.classList.add('is-up');btn.setAttribute('aria-label',c.name+'，已翻開');if(!first){first={btn,c};return;}second={btn,c};moves++;update();if(first.c.id===second.c.id){first.btn.classList.add('is-matched');second.btn.classList.add('is-matched');first.btn.setAttribute('aria-label',c.name+'，已配對');second.btn.setAttribute('aria-label',c.name+'，已配對');matched++;update();first=second=null;$('message').textContent='配對成功！✨';if(matched===8){stopTimer();setTimeout(win,600)}}else{locked=true;$('message').textContent='再記住這兩張牌的位置！';const thisRound=round;setTimeout(()=>{if(thisRound!==round)return;first.btn.classList.remove('is-up');second.btn.classList.remove('is-up');first.btn.setAttribute('aria-label','未翻開');second.btn.setAttribute('aria-label','未翻開');first=second=null;locked=false;$('message').textContent='繼續加油！'},950)}}
function win(){let stars=moves<=12?3:moves<=18?2:1;$('stars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);$('result').textContent='你用了 '+moves+' 次翻牌，花了 '+clock(elapsed)+'，成功配對全部 8 組！';$('win').hidden=false;confetti();}
function confetti(){const canvas=$('confetti'),ctx=canvas.getContext('2d');const ratio=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*ratio;canvas.height=innerHeight*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);const colors=['#ff8754','#f7c64b','#f26a95','#89c97a','#8abfe8','#b78be1'];let pieces=Array.from({length:145},()=>({x:Math.random()*innerWidth,y:-Math.random()*innerHeight,w:5+Math.random()*8,h:6+Math.random()*8,vy:2.2+Math.random()*3.5,spin:Math.random()*6.3,r:Math.random()*6.3,color:colors[Math.floor(Math.random()*colors.length)]}));let frame=0;function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);pieces.forEach(p=>{p.y+=p.vy;p.x+=Math.sin(frame*.03+p.spin)*.7;p.r+=.06;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});if(++frame<280)confettiAnimation=requestAnimationFrame(draw);else ctx.clearRect(0,0,innerWidth,innerHeight);}draw();}
$('reshuffle').addEventListener('click',fresh);$('playAgain').addEventListener('click',fresh);$('fruitMode').addEventListener('click',()=>{mode='fruit';fresh()});$('animalMode').addEventListener('click',()=>{mode='animal';fresh()});$('photoButton').addEventListener('click',()=>$('photos').click());$('photos').addEventListener('change',async e=>{const files=Array.from(e.target.files||[]);if(files.length!==8){alert('請一次選擇剛好 8 張照片（目前選了 '+files.length+' 張）。');e.target.value='';return;}if(files.some(f=>!f.type.startsWith('image/'))){alert('請選擇圖片格式的檔案。');e.target.value='';return;}try{customImages=await Promise.all(files.map(f=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f)})));mode='photo';fresh();$('message').textContent='成功載入 8 張照片！開始配對吧 📸';}catch{alert('照片讀取失敗，請再選一次。')}e.target.value='';});fresh();
</script></body></html>
